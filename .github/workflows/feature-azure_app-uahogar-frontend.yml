# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - APP-UAHogar-frontend

on:
  push:
    branches:
      - feature/Azure
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: APP_WEB/frontend/package-lock.json

      - name: Install dependencies
        working-directory: APP_WEB/frontend
        run: npm ci

      - name: Build frontend
        working-directory: APP_WEB/frontend
        env:
          VITE_API_URL: https://app-uahogar-cqhqgxcucaakg4b2.spaincentral-01.azurewebsites.net
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: APP_WEB/frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DEEB604154C1473592E090B8398AC8E9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C89B884DF678447FA79C536D85419CE3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_65A82A21914748A0873001DC0B27B6FB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'APP-UAHogar-frontend'
          slot-name: 'Production'
          package: dist
