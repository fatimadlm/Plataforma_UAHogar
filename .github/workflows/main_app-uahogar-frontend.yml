# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - APP-UAHogar-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: APP_WEB/frontend/package-lock.json

      - name: Install dependencies
        working-directory: APP_WEB/frontend
        run: npm ci

      - name: Build frontend
        working-directory: APP_WEB/frontend
        env:
          VITE_API_URL: https://app-uahogar-cqhqgxcucaakg4b2.spaincentral-01.azurewebsites.net
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: APP_WEB/frontend/dist


  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1F747BA7A3B540E68A5AC32D074AFD31 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_91528448E2604553853D9F68EE656CCB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_13D1AC20D15D4C4780DA051500B46B19 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'APP-UAHogar-frontend'
          slot-name: 'Production'
          package: .
          
