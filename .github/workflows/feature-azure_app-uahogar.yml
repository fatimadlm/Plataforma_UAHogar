# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - APP-UAHogar

on:
  push:
    branches:
      - feature/Azure
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven
        working-directory: APP_WEB
        run: mvn clean package -DskipTests

      - name: Comprobar configuración del JAR
        working-directory: APP_WEB
        run: |
          echo "=== Archivos application dentro del JAR ==="
          jar tf target/UAHogar-0.0.1-SNAPSHOT.jar | grep application

          echo "=== application-prod.yaml dentro del JAR ==="
          unzip -p target/UAHogar-0.0.1-SNAPSHOT.jar BOOT-INF/classes/application-prod.yaml

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/APP_WEB/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0B8589F639BC453DA7C5E28CDE4AAEA0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5E04F962123640CA97AA170107788064 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_109B11BE96AE405F913D78225E5504F9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'APP-UAHogar'
          slot-name: 'Production'
          package: '*.jar'
          
